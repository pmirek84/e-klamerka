name: Build and Deploy E-Klamerka PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PWA & Trigger Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA bundle
        run: npm run build

      - name: Trigger OVH Deploy Webhook
        env:
          WEBHOOK_URL: ${{ secrets.OVH_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "Triggering OVH deployment webhook..."
            curl -X POST "$WEBHOOK_URL"
          else
            echo "No OVH_WEBHOOK_URL secret configured. Skipping webhook trigger."
          fi
