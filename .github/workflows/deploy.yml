name: Build and Deploy E-Klamerka PWA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build PWA bundle
        run: npm run build:ovh

      - name: Trigger OVH Deploy Webhook
        if: ${{ secrets.OVH_WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.OVH_WEBHOOK_URL }}
        run: |
          echo "Triggering OVH deployment webhook..."
          curl -X POST "$WEBHOOK_URL"
