name: Build E-Klamerka for OVH
on:
  push:
    branches: [main, codex/e-klamerka-pwa-prototype]
    paths:
      - 'gra/**'
      - '.github/workflows/build-pwa.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gra/package-lock.json
      - run: npm ci
        working-directory: gra
      - run: rm -rf assets && npm run build
        working-directory: gra
      - name: Save static package for OVH
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gra/index.html gra/assets gra/icon.svg gra/sw.js gra/manifest.webmanifest
          if ! git diff --cached --quiet; then
            git commit -m 'Build PWA package for OVH'
            git push
          fi
